<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title">
  <title id="title">Illustration of an MRI scanner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12304A" />
      <stop offset="100%" stop-color="#264A72" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1677C8" />
      <stop offset="100%" stop-color="#20B2AA" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)" />
  <circle cx="680" cy="80" r="150" fill="#20B2AA" fill-opacity="0.16" />

  <!-- Scanner gantry -->
  <g transform="translate(150 90)">
    <rect x="0" y="0" width="330" height="300" rx="46" fill="url(#accent)" />
    <circle cx="165" cy="150" r="98" fill="#0C2337" fill-opacity="0.85" />
    <circle cx="165" cy="150" r="74" fill="#12304A" />
    <circle cx="165" cy="150" r="74" fill="none" stroke="#79DCD5" stroke-opacity="0.7" stroke-width="6" stroke-dasharray="18 14" />
  </g>

  <!-- Patient bed -->
  <g transform="translate(420 300)">
    <rect x="0" y="0" width="260" height="34" rx="16" fill="#FFFFFF" fill-opacity="0.92" />
    <rect x="26" y="-30" width="150" height="34" rx="16" fill="#B9CEE1" />
    <rect x="120" y="34" width="26" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.55" />
    <rect x="60" y="106" width="150" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.35" />
  </g>

  <g fill="#20B2AA">
    <circle cx="90" cy="70" r="9" />
    <circle cx="130" cy="70" r="6" fill-opacity="0.6" />
    <circle cx="164" cy="70" r="4" fill-opacity="0.35" />
  </g>
</svg>
