<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Medical image placeholder</title>
  <desc id="desc">Neutral placeholder artwork shown when an approved photograph is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12304A" />
      <stop offset="100%" stop-color="#1677C8" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="640" cy="120" r="150" fill="#20B2AA" fill-opacity="0.18" />
  <circle cx="130" cy="500" r="180" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Abstract medical cross -->
  <g fill="#FFFFFF" fill-opacity="0.88">
    <rect x="352" y="212" width="96" height="240" rx="24" />
    <rect x="280" y="284" width="240" height="96" rx="24" />
  </g>

  <text
    x="400"
    y="512"
    text-anchor="middle"
    font-family="Manrope, Inter, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#FFFFFF"
  >
    Image placeholder
  </text>
  <text
    x="400"
    y="548"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="18"
    fill="#DCE7F0"
  >
    Replace with an approved, licensed photograph
  </text>
</svg>
